# Editor de textos de la web de Jacobo — Pages CMS (https://app.pagescms.org)
#
# Cada entrada de `content` es un formulario sobre un JSON de src/data/textos/.
# Al guardar, Pages CMS hace un commit en GitHub y Vercel vuelve a publicar la web sola.
#
# ⚠️ Pages CMS reescribe cada JSON SOLO con los campos de este esquema: si añades un campo
# al JSON, añádelo también aquí (y léelo en src/data/content.ts o site.ts), o se perderá
# en el siguiente guardado.

settings:
  commit:
    templates:
      update: "Textos: {name} (editado desde Pages CMS)"

components:
  etiqueta:
    type: string
    label: Etiqueta pequeña
    description: "Texto corto que sale en mayúsculas encima del título. Puede quedar vacío."
  titulo:
    type: string
    label: Título
    required: true
  texto:
    type: text
    label: Texto
    description: "Deja una línea en blanco entre párrafo y párrafo."
  descripcionGoogle:
    type: text
    label: Descripción para Google
    description: "El resumen que sale bajo el título en los resultados de búsqueda. Mejor que no pase de unos 155 caracteres."
    options:
      maxlength: 300
  icono:
    type: select
    label: Icono
    required: true
    description: "El dibujo de la tarjeta."
    options:
      values:
        - { name: "lucide:sunrise", label: "Amanecer" }
        - { name: "lucide:anchor", label: "Ancla" }
        - { name: "lucide:handshake", label: "Apretón de manos" }
        - { name: "lucide:tree-pine", label: "Árbol" }
        - { name: "lucide:battery-low", label: "Batería baja" }
        - { name: "lucide:baby", label: "Bebé" }
        - { name: "lucide:graduation-cap", label: "Birrete" }
        - { name: "lucide:message-circle", label: "Bocadillo de conversación" }
        - { name: "lucide:lightbulb", label: "Bombilla" }
        - { name: "lucide:sprout", label: "Brote de planta" }
        - { name: "lucide:compass", label: "Brújula" }
        - { name: "lucide:calendar-clock", label: "Calendario con reloj" }
        - { name: "lucide:bed", label: "Cama" }
        - { name: "lucide:lock", label: "Candado" }
        - { name: "lucide:smile", label: "Cara sonriente" }
        - { name: "lucide:house", label: "Casa" }
        - { name: "lucide:brain", label: "Cerebro" }
        - { name: "lucide:heart", label: "Corazón" }
        - { name: "lucide:heart-handshake", label: "Corazón con manos" }
        - { name: "lucide:heart-crack", label: "Corazón roto" }
        - { name: "lucide:sparkles", label: "Destellos" }
        - { name: "lucide:target", label: "Diana" }
        - { name: "lucide:shield-check", label: "Escudo" }
        - { name: "lucide:star", label: "Estrella" }
        - { name: "lucide:flower-2", label: "Flor" }
        - { name: "lucide:users", label: "Grupo de personas" }
        - { name: "lucide:leaf", label: "Hoja" }
        - { name: "lucide:footprints", label: "Huellas" }
        - { name: "lucide:book-open", label: "Libro abierto" }
        - { name: "lucide:flame", label: "Llama" }
        - { name: "lucide:moon", label: "Luna" }
        - { name: "lucide:briefcase", label: "Maletín" }
        - { name: "lucide:gamepad-2", label: "Mando de videojuegos" }
        - { name: "lucide:hand-heart", label: "Mano con corazón" }
        - { name: "lucide:map-pin", label: "Marcador de mapa" }
        - { name: "lucide:smartphone", label: "Móvil" }
        - { name: "lucide:mountain", label: "Montaña" }
        - { name: "lucide:cloud-rain", label: "Nube con lluvia" }
        - { name: "lucide:waves", label: "Olas" }
        - { name: "lucide:ear", label: "Oreja" }
        - { name: "lucide:user", label: "Persona" }
        - { name: "lucide:puzzle", label: "Pieza de puzle" }
        - { name: "lucide:feather", label: "Pluma" }
        - { name: "lucide:zap", label: "Rayo" }

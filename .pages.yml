        - { name: "lucide:coffee", label: "Taza de café" }
        - { name: "lucide:video", label: "Videocámara" }
        - { name: "lucide:wind", label: "Viento" }
  redSocial:
    type: string
    description: "Pega el enlace completo (https://…). Si lo dejas vacío, no sale."
    pattern:
      regex: '^(https://\S+)?$'
      message: "Tiene que ser un enlace completo que empiece por https://"

content:
  - name: inicio
    label: Inicio
    type: file
    path: src/data/textos/inicio.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: cabecera
        label: Portada (lo primero que se ve)
        type: object
        fields:
          - name: titulo
            label: Frase principal
            type: text
            required: true
            description: "El título grande de la portada. También sale en el pie de todas las páginas y en la descripción de Google."
          - name: texto
            component: texto
            label: Texto debajo de la frase
          - name: boton
            label: Texto del botón
            type: string
            required: true
          - name: destacados
            label: Datos destacados (máximo 3)
            type: object
            list:
              max: 3
            fields:
              - name: valor
                label: Dato en grande
                type: string
                required: true
                description: "Ej.: 50 min"
              - name: texto
                label: Texto pequeño debajo
                type: string
                description: "Ej.: por sesión"
      - name: llamadaFinal
        label: Recuadro final «¿Quieres dar el primer paso?»
        description: "Sale al final de Inicio, Sobre mí y Servicios."
        type: object
        fields:
          - name: titulo
            component: titulo
          - name: texto
            component: texto
          - name: boton
            label: Texto del botón
            type: string
            required: true

  - name: sobre-mi
    label: Sobre mí
    type: file
    path: src/data/textos/sobre-mi.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: cabecera
        label: Cabecera de la página
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
      - name: presentacion
        label: Presentación (sale también en la portada)
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
            description: "Sale aquí y en la portada. Deja una línea en blanco entre párrafo y párrafo."
          - name: textoAmpliado
            component: texto
            label: Texto adicional
            description: "Solo sale en la página Sobre mí, a continuación del anterior."
          - name: botonPortada
            label: Botón de la portada
            type: string
            required: true
            description: "El botón que lleva desde la portada a esta página."
      - name: valores
        label: Valores (tarjetas)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{titulo}"
        fields:
          - name: icono
            component: icono
          - name: titulo
            component: titulo
          - name: texto
            label: Texto
            type: text
      - name: formacion
        label: Formación
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: lista
            label: Títulos y estudios
            type: string
            list: true
      - name: enfoque
        label: Cómo trabajo
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
      - name: descripcionGoogle
        component: descripcionGoogle

  - name: servicios
    label: Servicios
    type: file
    path: src/data/textos/servicios.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: cabecera
        label: Cabecera de la página
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
      - name: areas
        label: En qué puedo ayudarte (sale también en la portada)
        description: "Dos pestañas, una por público. Si una se queda sin tarjetas, desaparece el selector."
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
          - name: adultos
            label: Pestaña «Adultos»
            type: object
            fields:
              - name: pestana
                label: Nombre de la pestaña
                type: string
                required: true
                description: "Ej.: Adultos"
              - name: detalle
                label: Texto pequeño bajo el nombre
                type: string
                description: "Ej.: Terapia individual. Puede quedar vacío."
              - name: lista
                label: Tarjetas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo}"
                fields:
                  - name: icono
                    component: icono
                  - name: titulo
                    component: titulo
                  - name: descripcion
                    label: Descripción
                    type: text
          - name: infantoJuvenil
            label: Pestaña «Infanto-juvenil»
            type: object
            fields:
              - name: pestana
                label: Nombre de la pestaña
                type: string
                required: true
                description: "Ej.: Infanto-juvenil"
              - name: detalle
                label: Texto pequeño bajo el nombre
                type: string
                description: "Ej.: Niños, adolescentes y familias. Puede quedar vacío."
              - name: lista
                label: Tarjetas
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{titulo}"
                fields:
                  - name: icono
                    component: icono
                  - name: titulo
                    component: titulo
                  - name: descripcion
                    label: Descripción
                    type: text
      - name: sesiones
        label: Cómo son las sesiones
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: lista
            label: Tarjetas
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{titulo}"
            fields:
              - name: icono
                component: icono
              - name: titulo
                component: titulo
              - name: texto
                label: Texto
                type: text
      - name: proceso
        label: El proceso, paso a paso (sale también en la portada)
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
          - name: pasos
            label: Pasos
            description: "Se numeran solos (01, 02, 03…) en el orden de la lista."
            type: object
            list:
              collapsible:
                collapsed: true
                summary: "{index}. {titulo}"
            fields:
              - name: titulo
                component: titulo
              - name: descripcion
                label: Descripción
                type: text
      - name: descripcionGoogle
        component: descripcionGoogle

  - name: preguntas
    label: Preguntas frecuentes
    type: file
    path: src/data/textos/preguntas.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: etiqueta
        component: etiqueta
      - name: titulo
        component: titulo
      - name: texto
        component: texto
      - name: lista
        label: Preguntas
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{pregunta}"
        fields:
          - name: pregunta
            label: Pregunta
            type: string
            required: true
          - name: respuesta
            component: texto
            label: Respuesta

  - name: contacto
    label: Contacto
    type: file
    path: src/data/textos/contacto.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: cabecera
        label: Cabecera de la página
        type: object
        fields:
          - name: etiqueta
            component: etiqueta
          - name: titulo
            component: titulo
          - name: texto
            component: texto
      - name: formulario
        label: Formulario
        type: object
        fields:
          - name: titulo
            label: Título del recuadro
            type: string
            required: true
          - name: nota
            label: Nota bajo el botón «Enviar mensaje»
            type: string
      - name: disponibilidad
        label: Disponibilidad
        type: object
        fields:
          - name: horario
            label: Horario
            description: "Una línea por franja. Ej.: Lunes a viernes · 9:00 – 13:00"
            type: string
            list: true
          - name: modalidad
            label: Modalidad
            type: string
            description: "Ej.: Sesiones online y presenciales."
      - name: whatsapp
        label: Recuadro de WhatsApp
        type: object
        fields:
          - name: titulo
            component: titulo
          - name: texto
            label: Texto
            type: text

  - name: datos
    label: Datos de contacto y perfil
    type: file
    path: src/data/textos/datos.json
    format: json
    operations:
      create: false
      rename: false
      delete: false
    fields:
      - name: nombre
        label: Nombre
        type: string
        required: true
        description: "Sale en la cabecera, en el pie de página y en el aviso legal."
      - name: tituloProfesional
        label: Profesión
        type: string
        required: true
        description: "Ej.: Psicólogo online y presencial"
      - name: colegiado
        label: Nº de colegiado
        type: string
        required: true
      - name: email
        label: Email
        type: string
        required: true
        description: "Sale en la web y en el aviso legal. Los mensajes del formulario NO cambian de destino al tocar esto: eso se configura aparte (Formspree)."
        pattern:
          regex: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
          message: "Escribe un email válido."
      - name: telefono
        label: Teléfono
        type: string
        required: true
        description: "Tal como quieres que se vea. Ej.: +34 618 077 130"
      - name: whatsapp
        label: Número de WhatsApp
        type: string
        required: true
        description: "Todo junto, con el 34 delante y sin + ni espacios. Ej.: 34618077130"
        pattern:
          regex: '^[0-9]{11,15}$'
          message: "Solo números, con el 34 delante y sin espacios. Ej.: 34618077130"
      - name: whatsappMensaje
        label: Mensaje de WhatsApp
        type: string
        description: "El mensaje que aparece ya escrito cuando alguien pulsa el botón de WhatsApp."
      - name: ciudad
        label: Ciudad
        type: string
        required: true
      - name: redes
        label: Redes sociales
        type: object
        fields:
          - name: linkedin
            component: redSocial
            label: LinkedIn
          - name: instagram
            component: redSocial
            label: Instagram
          - name: facebook
            component: redSocial
            label: Facebook
